name: Openhouse
description: 'Openhouse is a network of neighborhood children''s learning centres in Bangalore
  and Kolkata, India, describing itself as a "Third Space" for children — neither home
  nor school, but a sanctuary for curiosity. It runs preschool programs for ages 1-6, a
  Parent-Toddler Club for ages 1-3, and Excel extracurriculars (robotics, public speaking,
  music, art and design) for ages 3-5+, built around a learning-by-doing philosophy. The
  consumer-facing website (openhouse.school, formerly openhouse.study) is a marketing and
  enrollment surface; the only network-visible technical surface is a private app backend
  health endpoint at api.openhouse.study. Openhouse was surfaced as a portfolio company of
  Accel and added to the API Evangelist network for enrichment. It publishes no public
  developer API, OpenAPI, SDKs, or developer documentation.'
